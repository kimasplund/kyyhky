name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Check the CLI loads
        run: |
          python -m kyyhky.cli --version
          python -m kyyhky.cli media
          python -m kyyhky.cli fonts
          python -m kyyhky.cli templates
          python -m kyyhky.cli symbologies

      - name: Build a job without a printer
        run: |
          python -m kyyhky.cli sample --out /tmp/addr.csv
          python -m kyyhky.cli preview --csv /tmp/addr.csv --out /tmp/labels.png
          python -m kyyhky.cli print --csv /tmp/addr.csv --dry-run

      - name: Custom templates, bar codes and QR
        run: |
          printf 'name,id\nOscilloscope,LAB-0001\nBench PSU,LAB-0002\n' > /tmp/items.csv
          for t in address shipping asset product qr-only name-badge; do
            python -m kyyhky.cli template-preview "$t" --out "/tmp/$t.png"
          done
          python -m kyyhky.cli template-init asset --out /tmp/my.json
          python -m kyyhky.cli template-preview /tmp/my.json --data /tmp/items.csv --out /tmp/batch.png
          python -m kyyhky.cli template-print /tmp/my.json --data /tmp/items.csv --dry-run
          python -m kyyhky.cli template-print asset --set name=Rig --set id=R-1 --dry-run
