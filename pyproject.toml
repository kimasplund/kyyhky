[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kyyhky"
version = "1.1.0"
description = "Labels for Brother QL printers over plain TCP: addresses, bar codes, QR codes, custom layouts. No vendor SDK."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kim Asplund", email = "kim.asplund@gmail.com" }]
keywords = [
    "brother", "ql-580n", "ql-series", "label", "label-printer",
    "raster", "packbits", "address-labels", "jetdirect", "printing",
    "barcode", "qrcode", "code128", "ean13", "label-template",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
    "Topic :: Office/Business",
]
dependencies = ["pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/kimasplund/kyyhky"
Repository = "https://github.com/kimasplund/kyyhky"
Issues = "https://github.com/kimasplund/kyyhky/issues"

[project.optional-dependencies]
qr = ["segno>=1.5"]
barcode = ["python-barcode>=0.15"]
yaml = ["PyYAML>=5.4"]
codes = ["segno>=1.5", "python-barcode>=0.15"]
all = ["segno>=1.5", "python-barcode>=0.15", "PyYAML>=5.4"]
dev = ["pytest>=7.0", "segno>=1.5", "python-barcode>=0.15", "PyYAML>=5.4"]

[project.scripts]
kyyhky = "kyyhky.cli:main"

[tool.setuptools]
packages = ["kyyhky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
